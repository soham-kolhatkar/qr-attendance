services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qra
      POSTGRES_PASSWORD: qra
      POSTGRES_DB: qr_attendance
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qra -d qr_attendance"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
