# Nightly backup of the live database, independent of the database provider.
#
# The dump is restored into a scratch database first, to prove it can be, then encrypted
# for the key in ops/backup-recipients.txt (the private key is kept off GitHub, see
# docs/DEPLOY.md) and kept as a workflow artifact for 30 days. This repository is public:
# nothing readable may be uploaded or printed here, only the encrypted file.
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 in India
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup

jobs:
  backup:
    # Forks never have the secret; don't try.
    if: github.repository == 'soham-kolhatkar/qr-attendance'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U restore -d restore"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Install age (encryption)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump the database
        # The newest pg_dump (18) can dump any older server too, so it works whichever
        # version the Neon project runs. Only the app's own schemas are copied (Neon keeps
        # some objects of its own that a plain Postgres can't recreate). Errors are
        # reported with addresses hidden: the logs of a public repository are public.
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the BACKUP_DATABASE_URL secret (docs/DEPLOY.md, Backups)"
            exit 1
          fi
          # Accept the value however it was pasted: Neon's "psql '…'" snippet, quotes, a newline.
          url=$(printf '%s' "$DATABASE_URL" | tr -d '\r\n' | sed -E "s/^[[:space:]]*(psql[[:space:]]+)?['\"]?//; s/['\"]?[[:space:]]*$//")
          if ! docker run --rm --network host -e URL="$url" postgres:18-alpine \
              sh -c 'pg_dump --format=custom --no-owner --no-privileges --schema=public --schema=drizzle "$URL"' > backup.dump 2> dump-errors.txt; then
            reason=$(sed -E 's#postgres(ql)?://[^ "]+#<database address>#g; s#[A-Za-z0-9.-]+\.neon\.tech#<neon host>#g; s#([0-9]{1,3}\.){3}[0-9]{1,3}#<ip>#g' dump-errors.txt | head -3 | tr '\n' ' ')
            echo "::error::pg_dump failed: ${reason:-no message}"
            exit 1
          fi
      - name: Check it restores
        run: |
          if ! docker run --rm --network host -v "$PWD:/backup" postgres:18-alpine \
              pg_restore --clean --if-exists --no-owner --no-privileges --exit-on-error \
              --dbname=postgres://restore:restore@localhost:5432/restore /backup/backup.dump 2> restore-errors.txt; then
            reason=$(grep -m3 -i 'error' restore-errors.txt | sed -E 's#postgres(ql)?://[^ "]+#<database address>#g' | tr '\n' ' ')
            echo "::error::The backup didn't restore: ${reason:-no message}"
            exit 1
          fi
          ask() { docker run --rm --network host postgres:18-alpine psql postgres://restore:restore@localhost:5432/restore -Atc "$1"; }
          if [ "$(ask "select to_regclass('public.institutes') is not null")" != "t" ]; then
            echo "::error::The backed-up database has none of the app's tables: BACKUP_DATABASE_URL must be the same database as Render's DATABASE_URL"
            exit 1
          fi
          if [ "$(ask "select count(*) from institutes")" -lt 1 ]; then echo "::error::The restored backup has no institutes"; exit 1; fi
          echo "Restored and checked."
      - name: Encrypt
        run: |
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
          age --encrypt --recipients-file ops/backup-recipients.txt --output "qr-attendance-$(date -u +%F).dump.age" backup.dump
          rm backup.dump
      - uses: actions/upload-artifact@v6
        with:
          name: database-backup-${{ env.DAY }}
          path: qr-attendance-*.dump.age
          retention-days: 30
          compression-level: 0
